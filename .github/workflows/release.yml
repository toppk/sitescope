# Builds the Linux tarballs for a vX.Y.Z tag and publishes them as a GitHub release.
# A tag push runs it; workflow_dispatch runs it for a tag pushed before this workflow existed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release, e.g. v1.6.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check the tag
        run: |
          v=$(cat VERSION)
          [ "$TAG" = "v$v" ] || { echo "tag $TAG doesn't match VERSION $v"; exit 1; }
          [ -f "release-notes/$v.md" ] || { echo "no release-notes/$v.md"; exit 1; }

      # a release needs an annotated tag, signed by the owner's key, that GitHub verifies, on the commit being built
      - name: Check the signature
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER: 602E32E9DC61AEE33584BBD67DAD569BB473919B
        run: |
          fail() { echo "release refused: $*"; exit 1; }
          api=repos/$GITHUB_REPOSITORY/git
          [ "$(gh api "$api/ref/tags/$TAG" --jq .object.type)" = tag ] || fail "$TAG isn't an annotated tag"
          obj=$(gh api "$api/ref/tags/$TAG" --jq .object.sha)
          [ "$(gh api "$api/tags/$obj" --jq .verification.verified)" = true ] || fail "GitHub doesn't verify $TAG's signature"
          reason=$(gh api "$api/tags/$obj" --jq .verification.reason)
          [ "$reason" = valid ] || fail "$TAG's verification reason is $reason, not valid"
          target=$(gh api "$api/tags/$obj" --jq .object.sha)
          [ "$target" = "$(git rev-parse HEAD)" ] || fail "$TAG points at $target, not the checked-out $(git rev-parse HEAD)"
          signer=$(gh api "$api/tags/$obj" --jq .verification.signature | gpg --list-packets 2>/dev/null |
            sed -n 's/.*hashed subpkt 33 len [0-9]* (issuer fpr v[0-9] \([0-9A-F]*\)).*/\1/p' | head -1)
          [ "$signer" = "$SIGNER" ] || fail "$TAG is signed by ${signer:-an unknown key}, not $SIGNER"
          echo "$TAG: annotated, verified, signed by $signer, at $target"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          v=$(cat VERSION)
          ver="$v+$(git rev-parse --short=7 HEAD)"
          # a release tagged before LICENSE was added takes it from the workflow's commit
          [ -f LICENSE ] || git show "$GITHUB_SHA:LICENSE" > LICENSE
          mkdir -p dist
          for t in linux/amd64 linux/arm64; do
            n="sitescope-$v-${t%/*}-${t#*/}"
            mkdir -p "stage/$n"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w -X main.version=$ver" -o "stage/$n/sitescope" .
            cp LICENSE README.md "stage/$n/"
            cp "release-notes/$v.md" "stage/$n/RELEASE-NOTES.md"
            tar -C stage --owner=0 --group=0 --numeric-owner --sort=name \
              --mtime="@$(git log -1 --format=%ct)" -czf "dist/$n.tar.gz" "$n"
          done
          "./stage/sitescope-$v-linux-amd64/sitescope" version | grep -qx "$ver"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          gh release create "$TAG" dist/* --verify-tag --title "sitescope $v" --notes-file "release-notes/$v.md"
